<style>
/* --------------------------------------------------------- */
/* GLOBAL PAGE SETTINGS                                      */
/* --------------------------------------------------------- */

body {
    font-family: Arial, sans-serif;
    background: #ffffff;
    margin: 0;
    color: #1f2e1f;
    line-height: 1.6;
    scroll-behavior: smooth;
}

/* --------------------------------------------------------- */
/* TOP NAV (Benefits • Usage • Ingredients • Performance)     */
/* --------------------------------------------------------- */

.top-menu {
    position: sticky;
    top: 0;
    background: #0c2a18;
    padding: 8px 0;
    z-index: 1000;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    text-align: center;
}

.top-menu a {
    color: #ffffff;
    margin: 0 18px;
    font-size: 14px;
    text-decoration: none;
    font-weight: bold;
    letter-spacing: 0.5px;
}

.top-menu a:hover {
    opacity: 0.75;
}

/* --------------------------------------------------------- */
/* MAIN PAGE CONTAINER                                       */
/* --------------------------------------------------------- */

.container {
    width: 100%;
    max-width: 1200px;       /* ★ Medium width */
    margin: 40px auto;
    padding: 20px 40px;
    box-sizing: border-box;
}

/* Page Header */
h1 {
    text-align: center;
    margin-bottom: 5px;
    font-size: 32px;
    letter-spacing: 0.5px;
    color: #0c2a18;
}

.subhead {
    text-align: center;
    margin-bottom: 40px;
    color: #555;
    font-size: 14px;
}

/* Section Titles */
.section-title {
    font-size: 22px;
    font-weight: bold;
    text-align: left;
    margin: 60px auto 25px;
    padding-bottom: 8px;
    color: #0c2a18;
    border-bottom: 2px solid #0c2a18;
    max-width: 1200px;
}

/* --------------------------------------------------------- */
/* FAQ ROWS — UPGRADED                                       */
/* --------------------------------------------------------- */

.faq-row {
    width: 100%;
    max-width: 100%;
    margin: 0 auto 25px auto;
    background: #f9fcf9;            /* light greenish-white */
    border-radius: 10px;             /* rounded corners */
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);  /* soft shadow */
    padding: 20px 24px;
    box-sizing: border-box;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
}

.faq-row:nth-child(even) {
    background: #f3f7f3;            /* subtle alternate color */
}

.faq-row:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
}

/* Question Styles */
.question {
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 8px;
    color: #0c2a18;
}

/* Answer Styles */
.answer {
    color: #444;
    font-size: 15px;
    line-height: 1.55;
}

/* --------------------------------------------------------- */
/* MOBILE RESPONSIVE                                         */
/* --------------------------------------------------------- */

@media only screen and (max-width: 768px) {

    .container {
        padding: 10px 15px;
        margin: 20px auto;
    }

    .faq-row {
        padding: 15px 18px;
        max-width: 100%;
    }

    h1 {
        font-size: 26px;
    }

    .section-title {
        font-size: 18px;
    }
}
</style>
