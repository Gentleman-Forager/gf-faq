<style>

/* --------------------------
   GLOBAL PAGE STYLING
--------------------------- */
body {
    font-family: Arial, sans-serif;
    background: #ffffff;
    margin: 0;
    color: #1f2e1f;
    line-height: 1.6;
    scroll-behavior: smooth;
}

/* --------------------------
   TOP NAV MENU (Green Bar)
--------------------------- */
.top-menu {
    position: sticky;
    top: 0;
    background: #0c2a18;
    padding: 10px 0;
    z-index: 1000;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.top-menu a {
    color: #ffffff;
    margin: 0 15px;
    font-size: 14px;
    text-decoration: none;
    font-weight: bold;
    letter-spacing: 0.5px;
}

.top-menu a:hover {
    opacity: 0.7;
}

/* --------------------------
   PAGE CONTAINER
   (THIS CONTROLS THE WIDTH)
--------------------------- */
.container {
    width: 100%;
    max-width: 1200px;    /* ← Increased from 900px */
    margin: 40px auto;
    padding: 20px;
}

/* --------------------------
   PAGE TITLES
--------------------------- */
h1 {
    text-align: center;
    margin-bottom: 5px;
    font-size: 32px;
    letter-spacing: 0.5px;
    color: #0c2a18;
}

.subhead {
    text-align: center;
    margin-bottom: 40px;
    color: #666;
    font-size: 14px;
}

/* SECTION TITLES (Benefits, Usage, Ingredients, etc.) */
.section-title {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin: 50px 0 30px 0;
    padding-bottom: 5px;
    border-bottom: 2px solid #0c2a18;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
}

/* --------------------------
   FAQ ROWS (THE MAIN FIX)
--------------------------- */
.faq-row {
    width: 100%;               /* Full available width */
    max-width: 1000px;         /* Increased from 600–900 */
    margin: 0 auto 20px auto;  /* Center & space below */
    background: #f5f5f5;
    border-radius: 6px;
    padding: 20px;
    box-sizing: border-box;    /* Prevents padding from shrinking width */
}

/* Question formatting */
.question {
    font-weight: bold;
    margin-bottom: 8px;
    color: #0c2a18;
}

/* Answer formatting */
.answer {
    color: #333;
}

/* --------------------------
   MOBILE RESPONSIVE
--------------------------- */
@media only screen and (max-width: 768px) {

    .container {
        padding: 10px;
        margin: 20px auto;
    }

    .faq-row {
        max-width: 95%;
        padding: 15px;
    }

    h1 {
        font-size: 26px;
    }

    .section-title {
        font-size: 18px;
    }
}

</style>
